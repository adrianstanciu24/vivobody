# .pre-commit-config.yaml
# vivobody
#
# Git hook gates. The commit stage runs file hygiene, SwiftFormat on staged
# Swift files, and the architecture and naming guardrails. The push stage runs
# the VivoKit snapshot contract tests.
#
# One-time setup per clone:
#
#   brew install pre-commit swiftformat
#   pre-commit install
#
# Run every hook against the full tree with:
#
#   pre-commit run --all-files
#   pre-commit run --all-files --hook-stage pre-push
#

minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: local
    hooks:
      # Formatting boundary: vivobody/, vivobodyWidgets/, and VivoKit/Sources/ only.
      - id: swiftformat
        name: SwiftFormat
        entry: Scripts/swiftformat-hook.sh
        language: system
        files: '^(vivobody/|vivobodyWidgets/|VivoKit/Sources/).*\.swift$'
        require_serial: true

      - id: check-architecture
        name: Architecture boundaries
        entry: /usr/bin/python3 Scripts/check_architecture.py
        language: system
        pass_filenames: false
        files: '\.swift$'

      - id: check-naming
        name: Swift naming conventions
        entry: /usr/bin/python3 Scripts/check_naming.py
        language: system
        pass_filenames: false
        files: '\.swift$'

      - id: vivokit-tests
        name: VivoKit snapshot contract tests
        entry: swift test --package-path VivoKit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
